services:
  pangpang-web:
    build: .
    container_name: pangpang-community
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      NODE_ENV: production
      PORT: 8765`n      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - pangpang-data:/app/data
volumes:
  pangpang-data:

