<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胖胖社区 · 提交管理</title><link rel="stylesheet" href="admin.css"></head><body><main><header><div><small>失控进化 · 胖胖社区服</small><h1>提交管理台</h1></div><button id="logout">退出</button></header><section id="login"><p>请输入服务器环境变量 ADMIN_TOKEN。</p><input id="token" type="password" placeholder="管理令牌"><button id="loginBtn">进入管理台</button><p id="loginError"></p></section><section id="dashboard" hidden><div class="toolbar"><b id="summary">加载中…</b><select id="filter"><option value="">全部状态</option><option value="new">新提交</option><option value="processing">处理中</option><option value="done">已完成</option><option value="archived">已归档</option></select><button id="refresh">刷新</button></div><div id="list"></div></section></main><script src="admin.js"></script></body></html>
